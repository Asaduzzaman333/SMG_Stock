<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://www.gstatic.com; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com; style-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'self'; frame-ancestors 'none'"
    />
    <title>SMG Stock | Inventory Command Center</title>
    <link rel="icon" type="image/png" href="smg-logo-blue.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="is-loading">
    <div class="page-loader" id="pageLoader" role="status" aria-live="polite" aria-label="SMG Stock is loading">
      <div class="loader-card">
        <div class="loader-logo-wrap">
          <img class="loader-logo" src="smg-logo-blue.png" alt="SMG Stock logo" />
        </div>
        <div class="loader-copy">
          <strong>SMG Stock</strong>
          <span>Preparing inventory workspace</span>
        </div>
        <div class="loader-progress" aria-hidden="true">
          <span></span>
        </div>
      </div>
    </div>

    <div id="root"></div>

    <script src="vendor/react.production.min.js"></script>
    <script src="vendor/react-dom.production.min.js"></script>
    <script type="module" src="app.js"></script>
  </body>
</html>
